        .loading-screen {
            position: absolute;

            z-index: 1;
            transition: opacity 0.3s ease;
        }
        .spinner {
            width: 45px;
            height: 45px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        iframe {
            position: relative;
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            z-index: 2;
        }
